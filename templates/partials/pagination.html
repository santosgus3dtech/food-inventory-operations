{% if page.paginator.num_pages > 1 %}<nav class="pagination-bar" aria-label="Páginas">{% if page.has_previous %}<a class="button secondary" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page.previous_page_number }}{% if not pagination_query %}&amp;q={{ request.GET.q|urlencode }}&amp;status={{ request.GET.status|urlencode }}{% endif %}">Anterior</a>{% endif %}<span>Página {{ page.number }} de {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="button secondary" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page.next_page_number }}{% if not pagination_query %}&amp;q={{ request.GET.q|urlencode }}&amp;status={{ request.GET.status|urlencode }}{% endif %}">Próxima</a>{% endif %}</nav>{% endif %}
