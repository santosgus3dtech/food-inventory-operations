[project]
name = "food-inventory-operations"
version = "0.1.0"
description = "Multi-site food inventory and operations platform"
requires-python = ">=3.13,<3.15"
dependencies = [
    "Django[argon2]>=5.2.8,<5.3",
    "psycopg[binary]>=3.2,<4",
    "dj-database-url>=2.3,<4",
    "python-dotenv>=1.1,<2",
    "django-axes>=8,<9",
    "whitenoise>=6.9,<7",
    "gunicorn>=23,<24; sys_platform != 'win32'",
    "defusedxml>=0.7,<1",
    "pypdf>=6,<7",
    "pdfplumber>=0.11,<1",
]

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.ruff]
line-length = 100
exclude = ["ref", ".local"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
